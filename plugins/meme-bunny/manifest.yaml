# =============================================
# Xime Lua 插件元数据（宿主用 YAML 解析）
# =============================================

# 插件唯一标识（沿用原 DEX 插件 id，覆盖旧实现）
id: com.kingzcheung.xime.plugin.meme_bunny

# 插件名称与描述
name: 恶搞兔表情包
description: 恶搞兔表情包（6 个表情图片示例插件）。

# 插件中心列表图标（字符图标）
icon: "🐰"

# 插件版本（字符串）
version: 3.0.1

# 插件分类：emoji 表情（多选启用，即时生效）
type: emoji
activation: multi

# 入口脚本
entry: main.lua

# 能力声明
capabilities:
  emoji:
    supportsSearch: true
    columns: 3
    itemHeightDp: 110
