name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.8.2)'
        required: true
        type: string
        default: 'v2.8.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Tag push: GITHUB_REF is refs/tags/...; manual run: use the chosen tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Setup signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Avoid indented heredoc (leading spaces break base64); strip whitespace in secret.
          KEY_B64=$(printf '%s' "$SIGNING_KEY" | tr -d '[:space:]')
          if [ -z "$KEY_B64" ]; then
            echo "::error::SIGNING_KEY secret is empty"
            exit 1
          fi
          printf '%s\n' \
            "keyBase64=${KEY_B64}" \
            "storePassword=${KEY_STORE_PASSWORD}" \
            "keyAlias=${ALIAS}" \
            "keyPassword=${KEY_PASSWORD}" \
            > app/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs (Signed)
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/Xime-*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" >/dev/null
            echo "Verified: $apk"
          done

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Find APKs and plugin XIPKs
        id: find_apks
        run: |
          MAIN_APKS=$(find app/build/outputs/apk/release -name "Xime-*.apk" -type f | sort | tr '\n' ',' | sed 's/,$//')
          PLUGIN_XIPKS=$(find build/plugin-release -name "*.xipk" -type f | sort | tr '\n' ',' | sed 's/,$//')

          echo "main_apks=$MAIN_APKS" >> $GITHUB_OUTPUT
          echo "plugin_xipks=$PLUGIN_XIPKS" >> $GITHUB_OUTPUT

          if [ -z "$MAIN_APKS" ]; then
            echo "::warning::No main app APKs found!"
          fi
          if [ -z "$PLUGIN_XIPKS" ]; then
            echo "::warning::No plugin XIPKs found!"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # Required for workflow_dispatch (GITHUB_REF is not a tag).
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Xime ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ${{ steps.find_apks.outputs.main_apks }}
            ${{ steps.find_apks.outputs.plugin_xipks }}
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
